name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm exec prettier --check app components/encore lib/encore tests
      # `pnpm lint` is not run yet: the imported baseline has 3 lint errors
      # (see docs/engineering/PROGRESS.md). Add it once those are fixed.
      - run: pnpm build
      - run: pnpm build:pages
        env:
          ENCORE_BASE_PATH: /${{ github.event.repository.name }}
