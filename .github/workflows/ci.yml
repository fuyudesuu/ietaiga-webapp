name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned: Playwright 1.56 cannot install Chromium on Ubuntu 26.04, which
    # ubuntu-latest became in November 2026. Move up together with Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:scale
      - run: pnpm check:boundaries
      - run: pnpm test
      # Account-isolation policies against a real PostgreSQL (preinstalled on
      # the GitHub Ubuntu runner).
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm build:pages
        env:
          ENCORE_BASE_PATH: /${{ github.event.repository.name }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          ENCORE_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
