# Supply-chain policy: only install versions published at least 7 days ago,
# verify the lockfile, and run install scripts only for allowlisted packages.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  miniflare>sharp: 0.35.4
patchedDependencies:
  vinext@1.0.0-beta.5: patches/vinext@1.0.0-beta.5.patch
